        radial-gradient(circle at bottom left, #eef7ff 0%, transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
      position: relative;
      color: #0f172a;
    }

    /* 배경 장식 */
    body::before {
      content: "";
      position: absolute;
      left: -120px;
      top: 120px;
      width: 360px;
      height: 360px;
      border: 1px solid rgba(0,176,240,0.08);
      border-radius: 50%;
    }

    body::after {
      content: "";
      position: absolute;
      right: -160px;
      bottom: 0px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0,176,240,0.10) 0%, rgba(0,176,240,0.02) 45%, transparent 70%);
      border-radius: 50%;
    }

    .faq-link {
      position: absolute;
      top: 28px;
      right: 28px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #5b6476;
      text-decoration: none;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(226,232,240,0.9);
      transition: color .2s ease, border-color .2s ease, transform .2s ease;
    }

    .faq-link:hover {
      color: #1479ff;
      border-color: rgba(20,121,255,0.35);
      transform: translateY(-2px);
    }

    .faq-link svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    @media (max-width: 560px) {
      .faq-link {
        top: 18px;
        right: 18px;
        padding: 7px 12px;
        font-size: 13px;
      }

      .faq-link span {
        display: none;
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 24px 48px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      text-align: center;
      margin-bottom: 56px;
    }

 .logo{
  width: 88px;
  height: 88px;
  margin: 0 auto 22px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(1,177,236,0.22);
  background: white;
}

.logo img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: #1479ff;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 60px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 22px;
      color: #06143a;
    }

    .divider {
      width: 48px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #00b0f0, #1479ff);
      margin: 0 auto 22px;
    }

    .hero p {
      font-size: 18px;
      color: #5b6476;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px;
      margin-bottom: 56px;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 32px;
      padding: 40px 36px 36px;
      box-shadow:
        0 24px 60px rgba(15,23,42,0.08),
        0 8px 20px rgba(15,23,42,0.04);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: transform .25s ease, box-shadow .25s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 32px 70px rgba(15,23,42,0.12),
        0 12px 24px rgba(15,23,42,0.06);
    }

    .card-number {
      position: absolute;
      right: 28px;
      top: 24px;
      font-size: 54px;
      font-weight: 800;
      color: rgba(20,121,255,0.08);
      letter-spacing: -0.04em;
    }

    .icon-wrap {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      position: relative;
    }

    .icon-wrap.blue {
      background: linear-gradient(135deg, #eef6ff 0%, #dcecff 100%);
    }

    .icon-wrap.yellow {
      background: linear-gradient(135deg, #fff7da 0%, #ffefb8 100%);
    }

    .icon-wrap.blue svg {
  width: 50px;
  height: 50px;
}

.icon-wrap.yellow svg {
  width: 58px;   height: 58px;
}

    .card h2 {
      font-size: 34px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
      color: #08112f;
    }

    .accent {
      width: 36px;
      height: 3px;
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .accent.blue {
      background: linear-gradient(90deg, #00b0f0, #1479ff);
    }

    .accent.yellow {
      background: linear-gradient(90deg, #ffcf33, #ffb300);
    }

    .card p {
      font-size: 17px;
      line-height: 1.8;
      color: #5f6b7a;
      margin-bottom: 34px;
      min-height: 96px;
    }

    .button {
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00b0f0 0%, #1479ff 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 14px 30px rgba(20,121,255,0.24);
    }

    .button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .footer {
      margin-top: auto;
      text-align: center;
      color: #5f6b7a;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .shield {
      width: 22px;
      height: 22px;
      color: #1479ff;
    }

    .contact-info {
      margin-top: 16px;
      text-align: center;
      color: #8a94a3;
      font-size: 13.5px;
      letter-spacing: 0.1px;
    }

    .contact-info a {
      color: #6b8fc9;
      font-weight: 500;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .wrap {
        padding-top: 44px;
      }

      h1 {
        font-size: 42px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 34px 28px 30px;
      }

      .card h2 {
        font-size: 28px;
      }

      .card p {
        min-height: auto;
      }
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 34px;
      }

      .hero p {
        font-size: 16px;
      }

      .logo {
        width: 76px;
        height: 76px;
        font-size: 30px;
      }
    }
