            linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
        margin: 0; padding: 32px 16px; color: #0f172a; min-height: 100vh;
        position: relative;
    }
    body::before {
        content: "";
        position: absolute;
        left: -120px;
        top: 120px;
        width: 360px;
        height: 360px;
        border: 1px solid rgba(0,176,240,0.08);
        border-radius: 50%;
    }
    body::after {
        content: "";
        position: absolute;
        right: -160px;
        bottom: 0px;
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(0,176,240,0.10) 0%, rgba(0,176,240,0.02) 45%, transparent 70%);
        border-radius: 50%;
    }
    .wrap { position: relative; z-index: 1; max-width: 1520px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 20px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #333; padding-bottom: 10px; }

    /* ===== 로그인 화면 (admin 게이트 화면과 동일한 스타일) ===== */
    .home-nav {
        position: fixed;
        top: 18px;
        left: 20px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(226,232,240,0.9);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        color: #5b6476;
        text-decoration: none;
        z-index: 999;
        transition: color .2s ease, border-color .2s ease;
    }
    .home-nav:hover { color: #1479ff; border-color: rgba(20,121,255,0.35); }
    .home-nav svg { width: 15px; height: 15px; stroke: currentColor; flex-shrink: 0; }

    /* 로그인 후 신청 내역 화면에서는 고정(fixed)이 아닌, faq.html과 동일한 인라인 배치의 버튼을 사용 */
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #5b6476;
        text-decoration: none;
        margin-bottom: 28px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(226,232,240,0.9);
        transition: color .2s ease, border-color .2s ease;
        width: fit-content;
    }
    .back-link:hover { color: #1479ff; border-color: rgba(20,121,255,0.35); }
    .back-link svg { width: 15px; height: 15px; stroke: currentColor; flex-shrink: 0; }

    .login-screen {
        min-height: calc(100vh - 64px);
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }
    .login-box {
        position: relative;
        z-index: 1;
        max-width: 380px;
        width: 100%;
        background: rgba(255,255,255,0.88);
        border: 1px solid rgba(226,232,240,0.9);
        border-radius: 32px;
        padding: 44px 40px 40px;
        box-shadow: 0 24px 60px rgba(15,23,42,0.08), 0 8px 20px rgba(15,23,42,0.04);
        backdrop-filter: blur(14px);
        text-align: center;
    }
    .login-logo { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px; overflow: hidden; box-shadow: 0 14px 32px rgba(1,177,236,0.22); background: #fff; }
    .login-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .login-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.28em; color: #1479ff; margin-bottom: 14px; }
    .login-box h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: #06143a; margin: 0 0 10px; }
    .login-divider { width: 40px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #00b0f0, #1479ff); margin: 0 auto 18px; }
    .login-box p { font-size: 14px; color: #5b6476; margin: 0 0 26px; line-height: 1.6; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .field input {
        width: 100%; height: 50px; padding: 0 16px;
        border: 1px solid #e2e8f0; border-radius: 14px;
        font-size: 14px; font-family: inherit;
        background: #fff; outline: none;
        transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input:focus { border-color: #1479ff; box-shadow: 0 0 0 3px rgba(20,121,255,0.12); }
    .login-btn {
        width: 100%; height: 50px; margin-top: 14px;
        border: none; border-radius: 14px; cursor: pointer;
        background: linear-gradient(135deg, #00b0f0 0%, #1479ff 100%);
        color: #fff; font-size: 15px; font-weight: 700;
        box-shadow: 0 14px 30px rgba(20,121,255,0.24);
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { filter: brightness(1.03); }
    .login-btn:disabled { opacity: .6; cursor: wait; }
    .login-error { margin-top: 14px; font-size: 13px; color: #dc2626; display: none; }
    .login-note { margin-top: 22px; display: flex; align-items: flex-start; gap: 8px; text-align: left; color: #8b95a5; font-size: 11.5px; line-height: 1.6; }
    .login-note svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; color: #1479ff; }

    /* ===== 결과 화면 ===== */
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input[type="text"] { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
    .filter-bar input[type="text"] { flex: 1; min-width: 200px; }
    .who { font-size: 13px; color: #555; }
    .who b { color: #0f172a; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; background: #6b7280; color: #fff; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #4b5563; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    #tableContainer { overflow-x: auto; }
    table { width: 100%; min-width: 1300px; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #eee; white-space: nowrap; }
    th { background: #f8f9fb; color: #555; font-weight: 600; }
    tr:hover td { background: #f9fafc; }
    .truncate-cell {
        display: inline-block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
        cursor: default;
    }
    .truncate-cell.flash-copied { color: #3b82f6; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge.알림톡 { background: #fef3c7; color: #92400e; }
    .badge.브랜드메시지 { background: #dbeafe; color: #1e40af; }
    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .status-badge.st-대기 { background: #f3f4f6; color: #4b5563; }
    .status-badge.st-검수요청 { background: #fef3c7; color: #92400e; }
    .status-badge.st-반려 { background: #fee2e2; color: #b91c1c; }
    .status-badge.st-완료 { background: #dcfce7; color: #166534; }
    .link-btn { padding: 5px 10px; font-size: 12px; border: 1px solid #3b82f6; color: #3b82f6; background: #fff; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; margin: 2px 4px 2px 0; }
    .link-btn:hover { background: #eff6ff; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #fff; border-radius: 14px; padding: 22px 24px; max-width: 420px; width: 90%; max-height: 70vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(15,23,42,0.18); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-header h3 { font-size: 15px; margin: 0; color: #0f172a; }
    .modal-close { border: none; background: none; font-size: 18px; line-height: 1; cursor: pointer; color: #94a3b8; padding: 2px 4px; }
    .modal-close:hover { color: #475569; }
    .modal-body { display: flex; flex-wrap: wrap; gap: 6px; }
    .muted { color: #aaa; font-size: 12px; }
    .empty, .status-msg { text-align: center; padding: 60px 0; color: #888; font-size: 14px; }
    .code-cell {
        max-width: 240px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        cursor: pointer;
        transition: background .15s ease;
        position: relative;
    }
    .code-cell:hover { background: #eff6ff; text-decoration: underline; color: #1479ff; }
    .code-cell.copied .code-text { visibility: hidden; }
    .copy-flash {
        display: none;
        position: absolute;
        left: 10px; right: 10px; top: 0; bottom: 0;
        align-items: center;
        background: transparent; color: #3b82f6; font-weight: 600;
        border-radius: 4px; padding: 0 4px;
    }
    .code-cell.copied .copy-flash { display: flex; }
</style>

                <option value="대기">대기</option>
                <option value="검수요청">검수요청</option>
                <option value="반려">반려</option>
                <option value="완료">완료</option>
            </select>
            <input type="text" id="searchInput" placeholder="템플릿명 검색" oninput="renderTable()">
        </div>
        <div id="tableContainer"><div class="status-msg">불러오는 중...</div></div>
    </div>

</div>

<div class="modal-overlay" id="attachModalOverlay" onclick="if(event.target===this) closeAttachModal()">
    <div class="modal-box">
        <div class="modal-header">
            <h3>📎 첨부파일</h3>
            <button class="modal-close" onclick="closeAttachModal()">✕</button>
        </div>
        <div class="modal-body" id="attachModalList"></div>
    </div>
</div>

<script>
    // ===================== 설정 =====================
    const WORKER_URL = "https://kct-lookup-proxy.hbyaang.workers.dev/"; // Cloudflare Worker 배포 URL로 교체하세요 (조회 전용)
    let allItems = [];
    const MASTER_ID = "kctb2b";
    const MASTER_PW = "1111";
    let isMasterMode = false;

    function escapeHtml(s) {
        return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 시트에 저장된 링크에서 파일ID만 추출 (두 가지 형식 모두 지원)
    // - 드라이브 원본 링크: https://drive.google.com/file/d/파일ID/view...
    // - Worker 스냅샷 링크: https://...workers.dev/?action=snapshot&fileId=파일ID
    function driveIdFromUrl(url) {
        const s = String(url || '');
        const byQuery = s.match(/[?&]fileId=([a-zA-Z0-9_-]+)/);
        if (byQuery) return byQuery[1];
        const byPath = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
        return byPath ? byPath[1] : '';
    }

    function formatCreatedAt(val) {
        if (!val) return '';
        const d = new Date(val);
        if (isNaN(d)) return escapeHtml(val);
        return d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
    }

    function parseAttachmentUrls(val) {
        if (!val) return [];
        return String(val).split(',').map(s => s.trim()).filter(Boolean);
    }

    // 템플릿코드 셀 클릭 시 전체 코드를 클립보드로 복사
    function copyCode(el) {
        const code = el.getAttribute('data-code');
        if (!code) return;
        navigator.clipboard.writeText(code).then(() => {
            el.classList.add('copied');
            clearTimeout(el._copyTimer);
            el._copyTimer = setTimeout(() => {
                el.classList.remove('copied');
            }, 900);
        }).catch(() => {
            alert('클립보드 복사에 실패했습니다. 직접 선택해서 복사해 주세요.');
        });
    }

    // 말줄임 처리된 셀(담당자이메일/템플릿유형/템플릿명)을 더블클릭하면
    // 화면에 잘려 보이는 텍스트가 아니라 title 속성에 담긴 전체 텍스트를 복사
    // (브라우저 기본 더블클릭 선택은 @, . 같은 기호에서 단어가 끊기므로, 전체 노드를 직접 선택해서 덮어씀)
    function copyPlainText(el, event) {
        if (event) event.preventDefault();
        const text = el.getAttribute('title') || el.textContent;
        if (!text) return;

        try {
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        } catch (e) {}

        navigator.clipboard.writeText(text).then(() => {
            el.classList.add('flash-copied');
            clearTimeout(el._copyTimer);
            el._copyTimer = setTimeout(() => {
                el.classList.remove('flash-copied');
            }, 900);
        }).catch(() => {
            alert('클립보드 복사에 실패했습니다. 직접 선택해서 복사해 주세요.');
        });
    }

    // 현재 조회 중인 세션 정보 (새로고침 시 재사용)
    let currentEmail = '';
    let currentSenderId = '';

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const senderId = document.getElementById('loginSenderId').value.trim();
        const errorEl = document.getElementById('loginError');
        errorEl.style.display = 'none';

        if (!email || !senderId) {
            errorEl.innerText = '이메일과 발신프로필 ID를 모두 입력해 주세요.';
            errorEl.style.display = 'block';
            return;
        }

        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        loginBtn.disabled = true;
        loginBtnText.innerText = '조회 중...';

        try {
            const isMaster = (email === MASTER_ID.toLowerCase() && senderId === MASTER_PW);
            const url = isMaster
                ? `${WORKER_URL}?action=listAll&password=${encodeURIComponent(senderId)}`
                : `${WORKER_URL}?action=list&email=${encodeURIComponent(email)}&senderId=${encodeURIComponent(senderId)}`;
            const res = await fetch(url);
            const data = await res.json();

            if (!data.ok) {
                errorEl.innerText = data.error || '이메일 또는 발신프로필 ID가 일치하지 않습니다.';
                errorEl.style.display = 'block';
                return;
            }

            isMasterMode = isMaster;
            currentEmail = email;
            currentSenderId = senderId;
            showResults(senderId, data.items || []);
        } catch (err) {
            errorEl.innerText = '조회 중 오류가 발생했습니다: ' + (err.message || '');
            errorEl.style.display = 'block';
        } finally {
            loginBtn.disabled = false;
            loginBtnText.innerText = '조회하기';
        }
    }

    // 새로고침: 로그아웃하지 않고 현재 발신프로필의 신청 내역을 다시 불러옴
    // 새로고침 클릭 후 5초간 쿨타임(버튼 비활성화) 적용
    const REFRESH_COOLDOWN_MS = 5000;

    async function handleRefreshClick() {
        if (!currentEmail || !currentSenderId) return;
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        const originalText = btn.innerText;
        btn.innerText = '🔄 불러오는 중...';
        const started = Date.now();

        try {
            const url = isMasterMode
                ? `${WORKER_URL}?action=listAll&password=${encodeURIComponent(currentSenderId)}`
                : `${WORKER_URL}?action=list&email=${encodeURIComponent(currentEmail)}&senderId=${encodeURIComponent(currentSenderId)}`;
            const res = await fetch(url);
            const data = await res.json();

            if (!data.ok) {
                alert(data.error || '신청 내역을 불러오지 못했습니다.');
                return;
            }

            showResults(currentSenderId, data.items || []);
        } catch (err) {
            alert('새로고침 중 오류가 발생했습니다: ' + (err.message || ''));
        } finally {
            btn.innerText = originalText;
            const elapsed = Date.now() - started;
            const remaining = REFRESH_COOLDOWN_MS - elapsed;
            setTimeout(() => { btn.disabled = false; }, remaining > 0 ? remaining : 0);
        }
    }

    function showResults(senderId, items) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.getElementById('homeNav').style.display = 'none';

        const whoDiv = document.querySelector('.who');
        if (isMasterMode) {
            whoDiv.innerHTML = `전체 신청 내역 (마스터) <span id="countText"></span>`;
        } else {
            whoDiv.innerHTML = `발신프로필 <b id="whoSenderId"></b>의 신청 내역 <span id="countText"></span>`;
            document.getElementById('whoSenderId').innerText = senderId;
        }

        // 최신순 정렬
        items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        allItems = items;
        renderTable();
    }

    function showAttachments(btn) {
        const files = JSON.parse(btn.dataset.files);
        document.getElementById('attachModalList').innerHTML = files
            .map((u, i) => `<a class="link-btn" href="${u}" target="_blank" rel="noopener">파일 ${i + 1}</a>`)
            .join('');
        document.getElementById('attachModalOverlay').style.display = 'flex';
    }

    function closeAttachModal() {
        document.getElementById('attachModalOverlay').style.display = 'none';
    }

    function renderTable() {
        const categoryVal = document.getElementById('categoryFilter').value;
        const statusVal = document.getElementById('statusFilter').value;
        const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

        const items = allItems.filter(it => {
            if (categoryVal && (it.category || '') !== categoryVal) return false;
            if (statusVal && (it.status || '대기') !== statusVal) return false;
            if (searchVal && !(it.templateName || '').toLowerCase().includes(searchVal)) return false;
            return true;
        });

        document.getElementById('countText').innerText = `(총 ${items.length}건)`;

        if (items.length === 0) {
            document.getElementById('tableContainer').innerHTML = '<div class="empty">신청 내역이 없습니다.</div>';
            return;
        }

        const rows = items.map(it => {
            const attachments = parseAttachmentUrls(it.attachmentUrls);
            const status = it.status || '대기';
            const templateCode = (it.templateCode || '').trim();
            return `
                <tr>
                    <td>${escapeHtml(formatCreatedAt(it.createdAt))}</td>
                    <td><span class="badge ${escapeHtml(it.category)}">${escapeHtml(it.category)}</span></td>
                    <td><span class="truncate-cell" title="${escapeHtml(it.managerEmail)}" ondblclick="copyPlainText(this, event)">${escapeHtml(it.managerEmail)}</span></td>
                    <td class="code-cell" title="${escapeHtml(templateCode)}" data-code="${escapeHtml(templateCode)}" onclick="copyCode(this)"><span class="code-text">${templateCode ? escapeHtml(templateCode) : '<span class="muted">-</span>'}</span><span class="copy-flash">복사됨 ✓</span></td>
                    <td><span class="truncate-cell" title="${escapeHtml(it.templateType)}" ondblclick="copyPlainText(this, event)">${escapeHtml(it.templateType)}</span></td>
                    <td><span class="truncate-cell" title="${escapeHtml(it.templateName)}" ondblclick="copyPlainText(this, event)">${escapeHtml(it.templateName)}</span></td>
                    <td>${it.snapshotUrl ? `<a class="link-btn" href="${WORKER_URL}?action=snapshot&fileId=${driveIdFromUrl(it.snapshotUrl)}" target="_blank" rel="noopener">신청서 보기</a>` : '<span class="muted">기록 없음</span>'}</td>
                    <td>${attachments.length === 0 ? '<span class="muted">파일 없음</span>' : attachments.length === 1 ? `<a class="link-btn" href="${attachments[0]}" target="_blank" rel="noopener">파일 보기</a>` : `<button class="link-btn" data-files="${escapeHtml(JSON.stringify(attachments))}" onclick="showAttachments(this)">파일 보기 (${attachments.length})</button>`}</td>
                    <td><span class="status-badge st-${escapeHtml(status)}">${escapeHtml(status)}</span></td>
                </tr>
            `;
        }).join('');

        document.getElementById('tableContainer').innerHTML = `
            <table>
                <thead><tr><th>신청일시</th><th>구분</th><th>담당자 이메일</th><th style="width:220px;">템플릿코드</th><th>템플릿 유형</th><th>템플릿명</th><th>상세</th><th>첨부파일</th><th>상태</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    // 엔터 키로도 로그인 가능하게
    document.getElementById('loginSenderId').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginEmail').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
